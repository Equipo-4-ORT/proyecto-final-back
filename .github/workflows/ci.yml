name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          # Inyectamos variables dummy solo para que pasen las validaciones
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          JWT_SECRET: 'test-jwt-secret'
          ADMIN_SECRET_KEY: 'test-admin-key'

  coverage:
    name: Coverage Check (80%)
    runs-on: ubuntu-latest
    if: >-
      github.base_ref == 'main' ||
      (github.base_ref == 'develop' && !startsWith(github.head_ref, 'release/'))

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check coverage
        run: npm run test:coverage
        env:
          # También inyectamos las variables para el reporte de coverage
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          JWT_SECRET: 'test-jwt-secret'
          ADMIN_SECRET_KEY: 'test-admin-key'
